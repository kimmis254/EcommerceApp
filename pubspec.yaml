name: ecommerceapp
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.6.2


dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  intl: ^0.20.2
  logger: ^2.5.0
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8
  iconsax: ^0.0.8
  iconsax_plus: ^1.0.0
  get_storage: ^2.1.1
  get: ^4.7.2
  flutter_native_splash: ^2.4.4
  smooth_page_indicator: ^1.2.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/icons/google.png
    - assets/icons/facebook.png
    - assets/logos/logo-dark.png
    - assets/logos/logo-light.png
    - assets/images/on_boarding_images/delivery.png
    - assets/images/on_boarding_images/payment.png
    - assets/images/on_boarding_images/shopping.png
    - assets/images/verify_email_images/verify_email.png
    - assets/images/verify_email_images/success.png
    - assets/images/verify_email_images/reset_password.png

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 800



